version: '3.7'
services:
  reseller-demo-server:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: api
    image: reseller-demo-server
    container_name: reseller-demo-server
    user: '0:0'
    ports:
      - 3001:3001/tcp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0' # Max 100% CPU
          memory: 4G # Max 4GB memory
        reservations:
          cpus: '0.5' # Reserve 50% CPU
          memory: 2G # Reserve 2GB memory
    env_file:
      - ../.env